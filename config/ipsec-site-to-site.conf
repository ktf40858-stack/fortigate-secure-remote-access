# =====================================================================
# FortiGate IPsec site-to-site - HQ <-> Branch, IKEv2
# Shown for BOTH ends. Secrets <PLACEHOLDER>, public IPs RFC 5737,
# LAN subnets RFC 1918. HQ public = 198.51.100.1, Branch = 203.0.113.1
# =====================================================================

# #####################################################################
# ###   HQ  FortiGate                                               ###
# #####################################################################

# --- Phase 1 (IKEv2): who the peer is and how we authenticate --------
config vpn ipsec phase1-interface
    edit "vpn-to-branch"
        set interface "port1"
        set ike-version 2                     # IKEv2, not v1 - no aggressive mode exposure
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes256gcm  # modern only; no DES/3DES/MD5/SHA1
        set dhgrp 14                           # 2048-bit MODP minimum
        set remote-gw 203.0.113.1
        set psksecret <PLACEHOLDER-STRONG-PSK>
        set dpd on-idle                        # detect a dead peer and tear down
    next
end

# --- Phase 2: WHAT crosses the tunnel. Selectors are scoped. ---------
config vpn ipsec phase2-interface
    edit "vpn-to-branch-p2"
        set phase1name "vpn-to-branch"
        set proposal aes256-sha256 aes256gcm
        set pfs enable                         # perfect forward secrecy on
        set dhgrp 14
        # ONLY the server subnet is offered - the branch does not get the whole HQ LAN
        set src-subnet 10.30.0.0 255.255.255.0
        set dst-subnet 10.50.0.0 255.255.255.0
        set keylifeseconds 3600
    next
end

# --- Route the branch subnet into the tunnel -------------------------
config router static
    edit 0
        set dst 10.50.0.0 255.255.255.0
        set device "vpn-to-branch"
    next
end

# --- Firewall policy: scoped both directions, inspected, logged ------
config firewall policy
    edit 20
        set name "hq-to-branch"
        set srcintf "port2"
        set dstintf "vpn-to-branch"
        set srcaddr "hq-servers"
        set dstaddr "branch-lan"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 21
        set name "branch-to-hq"
        set srcintf "vpn-to-branch"
        set dstintf "port2"
        set srcaddr "branch-lan"
        set dstaddr "hq-servers"               # branch reaches HQ servers only, not all of HQ
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next
end

# #####################################################################
# ###   BRANCH  FortiGate  (mirror image)                          ###
# #####################################################################

config vpn ipsec phase1-interface
    edit "vpn-to-hq"
        set interface "port1"
        set ike-version 2
        set peertype any
        set proposal aes256-sha256 aes256gcm
        set dhgrp 14
        set remote-gw 198.51.100.1
        set psksecret <PLACEHOLDER-STRONG-PSK>   # MUST match HQ
        set dpd on-idle
    next
end
config vpn ipsec phase2-interface
    edit "vpn-to-hq-p2"
        set phase1name "vpn-to-hq"
        set proposal aes256-sha256 aes256gcm
        set pfs enable
        set dhgrp 14
        set src-subnet 10.50.0.0 255.255.255.0   # mirror of HQ: src/dst swapped
        set dst-subnet 10.30.0.0 255.255.255.0
        set keylifeseconds 3600
    next
end
config router static
    edit 0
        set dst 10.30.0.0 255.255.255.0
        set device "vpn-to-hq"
    next
end
# Branch firewall policy mirrors HQ rules 20/21 with src/dst swapped.
