# =====================================================================
# FortiGate SSL VPN - roaming users, least-privilege by role
# FortiOS CLI. Eval-licence VM. Secrets are <PLACEHOLDER>, IPs RFC 1918
# / RFC 5737. Public interface = port1, LAN = port2.
# =====================================================================

# --- Address objects for the resources each role may reach -----------
config firewall address
    edit "app-server"
        set subnet 10.30.0.10 255.255.255.255
    next
    edit "file-server"
        set subnet 10.30.0.30 255.255.255.255
    next
    edit "sslvpn-pool"
        set type iprange
        set start-ip 10.212.134.100
        set end-ip 10.212.134.200
    next
end

# --- User groups (would map to LDAP/RADIUS groups in production) ------
config user local
    edit "employee1"
        set type password
        set passwd <PLACEHOLDER>
    next
    edit "contractor1"
        set type password
        set passwd <PLACEHOLDER>
    next
end
config user group
    edit "grp-employees"
        set member "employee1"
    next
    edit "grp-contractors"
        set member "contractor1"
    next
end

# --- Two portals: different access for different trust levels ---------
config vpn ssl web portal
    edit "portal-employees"
        set tunnel-mode enable
        set ip-pools "sslvpn-pool"
        # split tunnel: only the corp subnets go through the VPN, not all internet
        set split-tunneling enable
        set split-tunneling-routing-address "app-server" "file-server"
    next
    edit "portal-contractors"
        set tunnel-mode enable
        set ip-pools "sslvpn-pool"
        set split-tunneling enable
        # contractors: routed to the ONE app they need, nothing else
        set split-tunneling-routing-address "app-server"
    next
end

# --- SSL VPN settings: modern TLS only, map groups to portals --------
config vpn ssl settings
    set servercert "Fortinet_SSL"          # replace with a real CA-signed cert in production
    set tunnel-ip-pools "sslvpn-pool"
    set port 10443
    set source-interface "port1"
    set ssl-min-proto-ver tls1-2           # no TLS 1.0/1.1
    set ciphersuite TLS-AES-256-GCM-SHA384 TLS-AES-128-GCM-SHA256
    config authentication-rule
        edit 1
            set groups "grp-employees"
            set portal "portal-employees"
        next
        edit 2
            set groups "grp-contractors"
            set portal "portal-contractors"
        next
    end
end

# --- Firewall policy: identity-based, least privilege ----------------
# The tunnel authenticates. THESE rules are the actual access control.
config firewall policy
    edit 10
        set name "sslvpn-employees-to-apps"
        set srcintf "ssl.root"
        set dstintf "port2"
        set srcaddr "sslvpn-pool"
        set dstaddr "app-server" "file-server"
        set groups "grp-employees"          # policy tied to identity, not just source IP
        set action accept
        set schedule "always"
        set service "HTTPS" "SMB"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set logtraffic all
    next
    edit 11
        set name "sslvpn-contractors-to-app"
        set srcintf "ssl.root"
        set dstintf "port2"
        set srcaddr "sslvpn-pool"
        set dstaddr "app-server"            # ONE server, not the file server, not the LAN
        set groups "grp-contractors"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set logtraffic all
    next
    # NOTE: there is deliberately NO 'sslvpn -> LAN any/any' rule.
    # Anything not matched above hits the implicit deny and is logged.
end

